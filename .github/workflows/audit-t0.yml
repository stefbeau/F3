# F3 — Phase 1, Step 1.0 + 1.1: reference environment and T0 sanity check.
# Runs only when started by hand (Actions tab → "Audit T0" → Run workflow).
name: Audit T0 — reference sanity check

on:
  workflow_dispatch:
    inputs:
      earth4all_ref:
        description: "Earth4All.jl git ref to audit (branch, tag or commit hash). Leave empty for the repository's default branch."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  t0:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      F3_OUT: ${{ github.workspace }}/audit/results
      E4A_REF: ${{ inputs.earth4all_ref }}
    steps:
      - name: Check out F3
        uses: actions/checkout@v4

      - name: Set up Julia 1.10 (LTS)
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare output folder
        run: mkdir -p "$F3_OUT"

      # ---- World3 reference (D-012); environment pinned by audit/env/Manifest.toml (D-017) ----
      - name: Install the pinned World3 environment (D-017)
        continue-on-error: true
        run: >
          julia --project=audit/env -e
          'using Pkg;
          Pkg.instantiate();
          Pkg.precompile()'

      - name: T0.1 — World3 with WorldDynamics.jl
        continue-on-error: true
        run: julia --project=audit/env audit/t0/world3_t0.jl

      # ---- Earth4All reference (D-011): run as published, outside the F3 repo ----
      - name: Clone Earth4All.jl at the requested ref
        continue-on-error: true
        run: |
          git clone https://github.com/worlddynamics/Earth4All.jl "$RUNNER_TEMP/Earth4All.jl"
          cd "$RUNNER_TEMP/Earth4All.jl"
          if [ -n "$E4A_REF" ]; then git checkout "$E4A_REF"; fi
          echo "EARTH4ALL_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_ENV"
          echo "EARTH4ALL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # The packages come from the committed Manifest (audit/env-earth4all, resolved once for
      # commit 16f37d0 plus DataFrames and CSV), not from a run-time resolve. If a different
      # Earth4All.jl ref is requested, its sources are read from the clone but the packages are
      # still these pinned ones; the versions report says so.
      - name: Install the pinned Earth4All audit environment
        continue-on-error: true
        run: >
          julia --project=audit/env-earth4all -e
          'using Pkg;
          Pkg.instantiate();
          Pkg.precompile()'

      - name: T0.2 — Earth4All with Earth4All.jl
        continue-on-error: true
        run: julia --project=audit/env-earth4all audit/t0/earth4all_t0.jl "$RUNNER_TEMP/Earth4All.jl"

      # ---- World3 second check (D-012) ----
      - name: T0.3 — World3 with PyWorld3 (unmodified)
        continue-on-error: true
        run: |
          pip install pyworld3 pandas matplotlib
          python audit/t0/pyworld3_t0.py

      - name: T0.4 — Cross-check WorldDynamics.jl vs PyWorld3
        continue-on-error: true
        run: python audit/t0/compare_world3.py

      # ---- The packages' own test suites, as published ----
      - name: T0.5 — WorldDynamics.jl test suite
        continue-on-error: true
        run: |
          set -o pipefail
          julia --project=audit/env -e 'using Pkg; Pkg.test("WorldDynamics")' 2>&1 | tee "$F3_OUT/worlddynamics_tests.log" | tail -n 40

      - name: T0.5 — Earth4All.jl test suite
        continue-on-error: true
        run: |
          set -o pipefail
          # Earth4All.jl at 16f37d0 has no test folder; if a later ref has one, it is not run here because
          # the pinned audit environment is not the package's own environment.
          if [ -d "$RUNNER_TEMP/Earth4All.jl/test" ]; then
            echo "Earth4All.jl has a test folder at this ref, but the pinned audit environment is not the package environment: not run." | tee "$F3_OUT/earth4all_tests.log"
          else
            echo "No test folder in Earth4All.jl" | tee "$F3_OUT/earth4all_tests.log"
          fi

      - name: T0.5 — Summarize test outcomes
        if: always()
        run: |
          {
            echo "## T0.5 — Package test suites (as published)"
            for f in worlddynamics earth4all; do
              echo ""; echo "### $f"; echo '```'
              tail -n 25 "$F3_OUT/${f}_tests.log" 2>/dev/null || echo "no log"
              echo '```'
            done
          } > "$F3_OUT/t0_5_tests_report.md"

      # ---- Provenance ----
      - name: Record exact versions used
        if: always()
        run: |
          {
            echo "## Versions used in this run"
            echo ""
            echo "- Run date (UTC): $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "- F3 commit: \`$GITHUB_SHA\`"
            echo "- Julia: \`$(julia --version)\`"
            echo "- Earth4All.jl commit: \`${EARTH4ALL_COMMIT:-not cloned}\` (branch: ${EARTH4ALL_BRANCH:-unknown})"
            echo "- PyWorld3: \`$(pip show pyworld3 2>/dev/null | grep '^Version' || echo 'not installed')\`"
            echo ""
            echo "### WorldDynamics.jl environment"
            echo '```'
            julia --project=audit/env -e 'using Pkg; Pkg.status()'
            echo '```'
            echo ""
            echo "### Earth4All audit environment (pinned, audit/env-earth4all)"
            echo '```'
            julia --project=audit/env-earth4all -e 'using Pkg; Pkg.status()'
            echo '```'
          } > "$F3_OUT/t0_0_versions_report.md"
          cp audit/env/Project.toml audit/env/Manifest.toml "$F3_OUT/" || true
          cp audit/env-earth4all/Manifest.toml "$F3_OUT/earth4all_Manifest.toml" || true

      - name: Publish summary on the run page
        if: always()
        run: cat "$F3_OUT"/t0_*_report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-t0-results
          path: audit/results/
          retention-days: 90
