[project]
name = "f3"
version = "0.0.1"
description = "F3 - Foundation for Earth: open global simulation model (planetary limits and AI transition)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # second check for the World3 ports; used unmodified, never copied (CeCILL 2.1, D-001, D-012)
    "pyworld3==1.1",
    "pandas>=2",
    "scipy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
